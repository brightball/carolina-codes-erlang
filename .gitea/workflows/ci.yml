                              halt(0);
                          Other ->
                              io:format(standard_error, "fetch ci-env.sh failed: ~p~n", [Other]),
                              halt(1)
                      end
              end.
          strip_scheme("https://" ++ Rest) -> Rest;
          strip_scheme("http://" ++ Rest) -> Rest;
          strip_scheme(Rest) -> Rest.
          scheme("http://" ++ _) -> "http";
          scheme(_) -> "https".
          END
          escript /tmp/fetch-ci-env.escript
